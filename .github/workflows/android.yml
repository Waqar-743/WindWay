name: Build Windway Android APK

on:
  push:
    branches:
      - main
      - codex/flutter-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windway-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Native Kotlin Offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test game, website, color policy, mobile bridge and app shell
        run: npm exec tsc -- --noEmit && npm run test:colors && npm run test:game && npm run test:site && npm run test:android:bridge && npm run test:mobile:app

      - name: Prepare Android launcher icons
        run: npm run android:prepare:art

      - name: Bundle the unified offline 3D Android app
        run: npm run android:prepare:web

      - name: Verify Android assets and offline bundle
        run: npm run test:android:assets && npm run test:android:web

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Kotlin Android unit tests and build release APK
        working-directory: android
        run: gradle testDebugUnitTest assembleRelease

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: windway-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
