<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: ws://127.0.0.1:4175 ws://localhost:4175; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <script>if(new URLSearchParams(location.search).get('android')==='1'||new URLSearchParams(location.search).get('native')==='1'||new URLSearchParams(location.search).get('mobile')==='1')document.documentElement.classList.add('windway-native-boot');</script>
    <link rel="icon" type="image/svg+xml" href="./branding/windway-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0a09" />
    <title>Windway — Take the unforgettable way.</title>
    <meta name="description" content="Three extraordinary paths. Six progressive levels. Two precision machines. Race an alpine circuit, a jungle run, and a frozen summit in Windway by Waqar Ahmed." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Windway" />
    <meta property="og:title" content="Windway — Take the unforgettable way." />
    <meta property="og:description" content="Pick your path, level and machine through alpine bends, jungle canopy, and a frozen summit. Playable in your browser and offline on Android." />
    <meta property="og:url" content="https://waqar-743.github.io/WindWay/" />
    <meta property="og:image" content="https://waqar-743.github.io/WindWay/branding/windway-hero-jungle.jpg" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://waqar-743.github.io/WindWay/" />
    <style>
      #initial-loader{position:fixed;inset:0;display:grid;place-content:center;gap:17px;padding:32px;background:radial-gradient(ellipse at 50% 42%,#261d14 0%,#14110e 45%,#0b0a09 88%);color:#f5efe6;text-align:center;font-family:'Outfit','Trebuchet MS',Arial,sans-serif}#initial-loader:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#f2a93b24 1px,transparent 1px),linear-gradient(90deg,#f2a93b24 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(transparent,black 40%,transparent)}#initial-loader>*{position:relative}#initial-loader>.boot-logo{width:64px;height:64px;margin:auto;filter:drop-shadow(0 8px 24px #00000088)}#initial-loader>strong{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:38px;line-height:1;letter-spacing:.18em;font-weight:800;padding-left:.18em}.boot-road{position:relative;width:min(320px,78vw);height:54px;margin-top:12px;overflow:hidden;border-radius:3px;border-bottom:1px solid #f2a93b66;background:linear-gradient(180deg,#f2a93b00,#f2a93b0d),repeating-linear-gradient(90deg,#f2a93b88 0 15px,transparent 15px 30px) bottom 4px left/100% 1px no-repeat}.boot-car{position:absolute;inset:0;animation:boot-drive 2.1s cubic-bezier(0.32,0.12,0.55,0.92) infinite}.boot-car img{position:absolute;left:0;bottom:4px;width:96px;height:40px;filter:brightness(1.12) drop-shadow(0 4px 12px #f2a93b44)}#boot-label{max-width:320px;font-size:10px;line-height:1.6;letter-spacing:.12em;text-transform:uppercase;color:#b0a699;font-weight:500}#boot-retry{min-height:46px;padding:12px 20px;border:1px solid #f2a93b;border-radius:5px;background:#f2a93b;color:#120d08;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 0 24px #f2a93b28}#boot-error{max-width:320px;font-size:12px;line-height:1.7}#boot-error a{color:#f2a93b}#boot-retry:focus-visible,#boot-error a:focus-visible{outline:2px solid #f2a93b;outline-offset:4px}@keyframes boot-drive{from{transform:translateX(-100px)}to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.boot-car{animation:none;transform:translateX(calc(50% - 48px))}}
      .windway-native-boot body,.windway-native-boot #initial-loader{background:#0b0a09!important;color:#f5efe6}.windway-native-boot .boot-road{border-color:#f2a93b66}.windway-native-boot #boot-retry{background:#f2a93b;border-color:#f2a93b;color:#120d08}.mobile-app-boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b0a09;color:#f5efe6;font:14px 'Outfit','Trebuchet MS',Arial,sans-serif}
    </style>
  </head>
  <body style="margin:0;background:#0b0a09;overflow:hidden">
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
        <img class="boot-logo" src="./branding/windway-mark.svg" width="70" height="70" alt="" />
        <strong>WINDWAY</strong>
        <div class="boot-road" aria-hidden="true"><span class="boot-car"><img src="./branding/f1-loading-car.svg" width="96" height="40" alt="" /></span></div>
        <span id="boot-label">Road systems initializing. Loading Windway…</span>
        <button id="boot-retry" type="button" hidden onclick="window.location.reload()">Reload Windway</button>
        <p id="boot-error" hidden>The website files could not load. Try a refresh, or <a href="https://waqar-743.github.io/WindWay/">open Windway’s current address</a>.</p>
        <noscript><p>Enable JavaScript to explore Windway and play. <a href="https://github.com/Waqar-743/WindWay">Visit the project on GitHub</a>.</p></noscript>
      </div>
    </div>
    <script>window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT'){var label=document.getElementById('boot-label');var retry=document.getElementById('boot-retry');var note=document.getElementById('boot-error');if(label)label.textContent='The road could not load.';if(retry)retry.hidden=false;if(note)note.hidden=false}},true);</script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
