<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>if(new URLSearchParams(location.search).get('native')==='1'||new URLSearchParams(location.search).get('mobile')==='1')document.documentElement.classList.add('windway-native-boot');</script>
    <link rel="icon" type="image/svg+xml" href="./branding/windway-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3e7" />
    <title>Windway — Your road. Your pace.</title>
    <meta name="description" content="Your road. Your pace. Explore mountain bends, jungle roads, and a snowy summit in Windway. Choose your car and find your next favorite drive." />
    <meta property="og:title" content="Windway — Your road. Your pace." />
    <meta property="og:description" content="Mountain bends, jungle roads, and a snowy summit. A stylized driving escape by Waqar Ahmed, playable in your browser." />
    <meta property="og:url" content="https://waqar-743.github.io/WindWay/" />
    <meta property="og:image" content="https://waqar-743.github.io/WindWay/branding/windway-hero-jungle.jpg" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://waqar-743.github.io/WindWay/" />
    <style>
      #initial-loader{position:fixed;inset:0;display:grid;place-content:center;gap:16px;padding:28px;background:radial-gradient(circle at 50% 28%,#fffcf2 0%,#f6f1e3 58%,#eae3cf 100%);color:#1f382e;text-align:center;font-family:'Outfit','Trebuchet MS',Arial,sans-serif}#initial-loader>.boot-logo{width:72px;height:72px;margin:auto;filter:drop-shadow(0 8px 18px rgba(31,56,46,0.14))}#initial-loader>strong{font-size:24px;letter-spacing:-0.04em;font-weight:800}.boot-road{position:relative;width:min(320px,78vw);height:54px;margin-top:10px;overflow:hidden;border-radius:8px;border-bottom:2px solid #1f382e;background:linear-gradient(180deg,rgba(31,56,46,0.03),rgba(31,56,46,0.08)),repeating-linear-gradient(90deg,#1f382e55 0 15px,transparent 15px 30px) bottom 4px left/100% 2px no-repeat}.boot-car{position:absolute;inset:0;animation:boot-drive 2.1s cubic-bezier(0.32,0.12,0.55,0.92) infinite}.boot-car img{position:absolute;left:0;bottom:4px;width:96px;height:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.18))}#boot-label{max-width:320px;font-size:12px;line-height:1.6;color:#4a5d52;font-weight:500}#boot-retry{min-height:46px;padding:12px 20px;border:1.5px solid #1f382e;border-radius:999px;background:#e57646;color:#fffaf0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 #1f382e}#boot-error{max-width:320px;font-size:12px;line-height:1.7}#boot-error a{color:#a54e32}#boot-retry:focus-visible,#boot-error a:focus-visible{outline:3px solid #a54e32;outline-offset:4px}@keyframes boot-drive{from{transform:translateX(-100px)}to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.boot-car{animation:none;transform:translateX(calc(50% - 48px))}}
      .windway-native-boot body,.windway-native-boot #initial-loader{background:#0b141b!important;color:#edf3f2}.windway-native-boot .boot-road{border-color:#b8c9cf;background:repeating-linear-gradient(90deg,#b8c9cf55 0 15px,transparent 15px 30px) bottom 3px left/100% 2px no-repeat}.windway-native-boot #boot-retry{background:#dfba7a;border-color:#dfba7a;color:#14252e}.mobile-app-boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b141b;color:#edf3f2;font:14px 'Outfit','Trebuchet MS',Arial,sans-serif}
    </style>
  </head>
  <body style="margin:0;background:#f7f3e7;overflow:hidden">
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
        <img class="boot-logo" src="./branding/windway-mark.svg" width="70" height="70" alt="" />
        <strong>WINDWAY</strong>
        <div class="boot-road" aria-hidden="true"><span class="boot-car"><img src="./branding/f1-loading-car.svg" width="96" height="40" alt="" /></span></div>
        <span id="boot-label">Finding the long way. Loading Windway…</span>
        <button id="boot-retry" type="button" hidden onclick="window.location.reload()">Reload Windway</button>
        <p id="boot-error" hidden>The website files could not load. Try a refresh, or <a href="https://waqar-743.github.io/WindWay/">open Windway’s current address</a>.</p>
        <noscript><p>Enable JavaScript to explore Windway and play. <a href="https://github.com/Waqar-743/WindWay">Visit the project on GitHub</a>.</p></noscript>
      </div>
    </div>
    <script>window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT'){var label=document.getElementById('boot-label');var retry=document.getElementById('boot-retry');var note=document.getElementById('boot-error');if(label)label.textContent='The road could not load.';if(retry)retry.hidden=false;if(note)note.hidden=false}},true);</script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
