name: windway
description: Windway's offline Android driving escape by Waqar Ahmed.
publish_to: none
version: 1.1.1+3
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.0
  shared_preferences: 2.5.6
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/art/cartoon-pack/
    - assets/art/jungle-pack/
    - assets/art/snow-pack/
    - assets/art/branding/
    - assets/game/
    - assets/game/assets/
    - assets/game/branding/
    - assets/game/cartoon-pack/
    - assets/game/jungle-pack/
    - assets/game/snow-pack/
    - assets/game/models/mclaren-mcl38/
    - assets/game/models/mercedes-w14/
